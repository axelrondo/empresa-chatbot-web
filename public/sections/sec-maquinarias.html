<div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl border border-slate-200/80 space-y-6 animate-fade-in">
  
  <!-- Encabezado -->
  <div class="border-b border-slate-200 pb-4 flex justify-between items-center flex-wrap gap-2">
    <div>
      <h2 class="text-2xl font-black text-[#003366] uppercase tracking-wide drop-shadow-sm flex items-center gap-2">
        <i class="fa-solid fa-industry text-amber-500"></i> MAQUINARIA Y PRODUCTOS DE LIMPIEZA
      </h2>
      <p class="text-xs font-semibold text-slate-600 mt-1">Equipos industriales y productos especializados para limpieza profesional.</p>
    </div>
    <!-- Botón Admin (solo visible en la vista) -->
    <button onclick="checkAdminAuth()" 
      class="bg-slate-200 hover:bg-slate-300 text-slate-700 transition flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold cursor-pointer border border-slate-300">
      <i class="fa-solid fa-user-shield text-amber-600"></i> Acceso Admin
    </button>
  </div>

  <!-- Grid de Productos -->
  <div id="machineryGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Las cards se generan dinámicamente con JavaScript -->
    <div class="col-span-full text-center py-12 text-gray-400">
      <i class="fa-solid fa-spinner fa-spin text-2xl"></i>
      <p class="text-xs mt-2">Cargando catálogo de maquinaria...</p>
    </div>
  </div>
</div>

<!-- ============================================ -->
<!-- MODAL DE LOGIN ADMIN                          -->
<!-- ============================================ -->
<div id="modalAdminLogin" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden">
  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full mx-4 p-6 md:p-8 border border-slate-200">
    <div class="flex justify-between items-center border-b border-slate-200 pb-3 mb-4">
      <h3 class="font-black text-[#003366] text-lg uppercase flex items-center gap-2">
        <i class="fa-solid fa-lock text-amber-500"></i> Acceso Administrador
      </h3>
      <button onclick="closeModal('modalAdminLogin')" class="text-slate-400 hover:text-slate-600 text-xl">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    
    <form id="formAdminLogin" onsubmit="handleAdminLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Correo Electrónico</label>
        <input type="email" id="adminEmail" required 
          class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
          placeholder="admin@limbolivia.com" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Contraseña</label>
        <input type="password" id="adminPassword" required 
          class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
          placeholder="••••••••" />
      </div>
      <p id="loginErrorMsg" class="text-red-500 text-xs font-bold hidden">Credenciales incorrectas. Intenta nuevamente.</p>
      <button type="submit" 
        class="w-full bg-[#003366] hover:bg-[#002244] text-white font-bold py-2.5 rounded-lg transition text-sm uppercase tracking-wider">
        <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> Iniciar Sesión
      </button>
    </form>
  </div>
</div>

<!-- ============================================ -->
<!-- MODAL DE CARGA DE MAQUINARIA                  -->
<!-- ============================================ -->
<div id="modalUploadMachine" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center hidden">
  <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full mx-4 p-6 md:p-8 border border-slate-200 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-center border-b border-slate-200 pb-3 mb-4">
      <h3 class="font-black text-[#003366] text-lg uppercase flex items-center gap-2">
        <i class="fa-solid fa-cloud-arrow-up text-emerald-500"></i> Publicar Maquinaria
      </h3>
      <button onclick="closeModal('modalUploadMachine')" class="text-slate-400 hover:text-slate-600 text-xl">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    
    <form id="formUploadMachine" onsubmit="handleMachineUpload(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Código *</label>
        <input type="text" id="machineCodigo" required 
          class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
          placeholder="Ej: MAQ-001" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Nombre del Producto *</label>
        <input type="text" id="machineNombre" required 
          class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
          placeholder="Ej: Hidrolavadora Profesional" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Descripción</label>
        <textarea id="machineDescripcion" rows="3" 
          class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
          placeholder="Características técnicas, especificaciones, etc."></textarea>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Precio (Bs) *</label>
        <input type="number" id="machinePrecio" required step="0.01" min="0"
          class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
          placeholder="Ej: 1250.50" />
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Imagen del Equipo *</label>
        <input type="file" id="machineImage" accept="image/*" required
          class="w-full border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100" />
      </div>
      <button type="submit" id="btnSubmitMachine"
        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition text-sm uppercase tracking-wider">
        <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Publicar Producto
      </button>
    </form>
  </div>
</div>
