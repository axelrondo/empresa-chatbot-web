<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIM-BOLIVIA | Servicios de Limpieza Profesional</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased">

  <!-- HEADER ORIGINAL CON TU LOGO REAL -->
  <header class="w-full bg-[#003366] text-white">
    <div class="max-w-7xl mx-auto">
      <img src="/img/logo-limbolivia.png" alt="LIMBOLIVIA División Limpieza" class="w-full h-auto object-cover block">
    </div>

    <!-- Menú de Navegación -->
    <nav class="bg-[#002244] border-t border-[#004488] text-white text-xs font-bold uppercase">
      <div class="max-w-7xl mx-auto px-4 flex flex-wrap gap-2 sm:gap-6 py-2">
        <a href="#inicio" class="hover:text-amber-300 transition flex items-center gap-1.5 px-2 py-1"><i class="fa-solid fa-house"></i> Inicio</a>
        <a href="#empresa" class="hover:text-amber-300 transition flex items-center gap-1.5 px-2 py-1"><i class="fa-solid fa-building"></i> Empresa</a>
        <a href="#servicios" class="hover:text-amber-300 transition flex items-center gap-1.5 px-2 py-1"><i class="fa-solid fa-gear"></i> Servicios de Limpieza</a>
        <a href="#cotizador" class="text-amber-300 hover:text-white transition flex items-center gap-1.5 px-2 py-1"><i class="fa-solid fa-calculator"></i> Cotizador</a>
        <a href="https://wa.me/59171506930" target="_blank" class="hover:text-amber-300 transition flex items-center gap-1.5 px-2 py-1"><i class="fa-solid fa-envelope"></i> Contáctese</a>
      </div>
    </nav>
  </header>

  <!-- SLIDER PRINCIPAL CON BANNERS (banner1.png a banner4.png) -->
  <section id="inicio" class="relative max-w-7xl mx-auto overflow-hidden bg-slate-200">
    <div class="relative w-full h-[280px] sm:h-[380px] md:h-[450px]">
      <img id="mainSliderImg" src="/img/banner2.png" alt="Servicios LIMBOLIVIA" class="w-full h-full object-cover transition-all duration-500">
      
      <!-- Flecha Izquierda -->
      <button onclick="prevSlide()" class="absolute left-3 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white p-3 rounded-full transition shadow-lg">
        <i class="fa-solid fa-chevron-left text-xl"></i>
      </button>

      <!-- Flecha Derecha -->
      <button onclick="nextSlide()" class="absolute right-3 top-1/2 -translate-y-1/2 bg-black/40 hover:bg-black/70 text-white p-3 rounded-full transition shadow-lg">
        <i class="fa-solid fa-chevron-right text-xl"></i>
      </button>

      <!-- Botones Numéricos (1, 2, 3, 4) -->
      <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-1.5 bg-black/50 p-1.5 rounded-md">
        <button onclick="setSlide(0)" id="slideBtn-0" class="w-6 h-6 text-xs font-bold rounded text-white bg-slate-800 hover:bg-slate-700">1</button>
        <button onclick="setSlide(1)" id="slideBtn-1" class="w-6 h-6 text-xs font-bold rounded text-white bg-blue-600">2</button>
        <button onclick="setSlide(2)" id="slideBtn-2" class="w-6 h-6 text-xs font-bold rounded text-white bg-slate-800 hover:bg-slate-700">3</button>
        <button onclick="setSlide(3)" id="slideBtn-3" class="w-6 h-6 text-xs font-bold rounded text-white bg-slate-800 hover:bg-slate-700">4</button>
      </div>
    </div>
  </section>

  <!-- BARRA AZUL "¡ESTAMOS ATENTOS A SU LLAMADA!" -->
  <div class="bg-[#001845] text-white py-3.5 px-4 shadow-md">
    <div class="max-w-7xl mx-auto flex items-center gap-3">
      <div class="bg-red-600 text-white w-9 h-9 rounded-full flex items-center justify-center text-lg shadow shrink-0">
        <i class="fa-solid fa-headset"></i>
      </div>
      <span class="text-base sm:text-lg font-black uppercase tracking-wider">¡ESTAMOS ATENTOS A SU LLAMADA!</span>
    </div>
  </div>

  <!-- CONTENIDO PRINCIPAL / COTIZADOR -->
  <main class="max-w-7xl mx-auto py-8 px-4 space-y-12">

    <!-- SECCIÓN DE COTIZADOR DINÁMICO -->
    <section class="p-6 bg-slate-50 border-b rounded-2xl shadow-sm" id="cotizador">
      <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
        <i class="fa-solid fa-calculator text-emerald-600"></i> Cotizador Rápido de Servicios
      </h2>

      <div class="grid lg:grid-cols-3 gap-6 items-start">
        <!-- COLUMNA IZQUIERDA: CONFIGURADOR -->
        <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border space-y-6">
          
          <!-- 1. Pestañas de Servicios -->
          <div>
            <label class="block font-semibold text-gray-700 mb-2">1. Selecciona un Servicio para Configurar:</label>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
              <button onclick="selectServiceTab('Alfombras')" id="btn-Alfombras">
                <i class="fa-solid fa-rug text-xl"></i>
                <span>Lavado de Alfombras</span>
              </button>
              
              <button onclick="selectServiceTab('Oficinas')" id="btn-Oficinas">
                <i class="fa-solid fa-building text-xl"></i>
                <span>Limpieza de Oficinas</span>
              </button>
              
              <button onclick="selectServiceTab('Casas')" id="btn-Casas">
                <i class="fa-solid fa-house-chimney text-xl"></i>
                <span>Limpieza de Casas</span>
              </button>
              
              <button onclick="selectServiceTab('Post-Obra')" id="btn-Post-Obra">
                <i class="fa-solid fa-helmet-safety text-xl"></i>
                <span>Limpieza Post-Obra</span>
              </button>
            </div>
          </div>

          <!-- TARJETA DINÁMICA DE DETALLE -->
          <div id="serviceDetailCard" class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col sm:flex-row items-center gap-4 transition-all">
            <img id="serviceImage" src="/img/banner1.png" alt="Servicio" class="w-full sm:w-40 h-28 object-cover rounded-lg shadow shrink-0">
            <div>
              <h4 id="serviceTitle" class="font-bold text-slate-800 text-base mb-1">Lavado Profesional de Alfombras</h4>
              <p id="serviceDescription" class="text-xs text-gray-600 leading-relaxed"></p>
            </div>
          </div>

          <!-- 2. Control Metros Cuadrados -->
          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="font-semibold text-gray-700">2. Cantidad en Metros Cuadrados (m²):</label>
              <span id="m2Value" class="font-black text-emerald-600 text-xl bg-emerald-50 px-3 py-1 rounded-lg border border-emerald-200">15 m²</span>
            </div>
            
            <div class="flex items-center gap-3">
              <button onclick="changeM2Step(-1)" class="bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-800 font-bold w-10 h-10 rounded-lg text-lg flex items-center justify-center transition shadow-sm border border-slate-300 shrink-0" title="Restar 1 m²">
                <i class="fa-solid fa-minus"></i>
              </button>
              
              <input type="range" id="m2Slider" min="5" max="300" step="5" value="15" class="w-full accent-emerald-600 cursor-pointer h-2 bg-gray-200 rounded-lg" oninput="onSliderChange()">
              
              <button onclick="changeM2Step(1)" class="bg-slate-200 hover:bg-slate-300 active:bg-slate-400 text-slate-800 font-bold w-10 h-10 rounded-lg text-lg flex items-center justify-center transition shadow-sm border border-slate-300 shrink-0" title="Sumar 1 m²">
                <i class="fa-solid fa-plus"></i>
              </button>
            </div>
          </div>

          <!-- 3. Extras Opcionales -->
          <div>
            <label class="block font-semibold text-gray-700 mb-2">3. Extras Opcionales para este Servicio:</label>
            <div id="extrasContainer" class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs"></div>
          </div>

          <!-- BOTÓN AGREGAR -->
          <div class="pt-2">
            <button onclick="addCurrentToQuote()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition shadow-md text-sm uppercase tracking-wide">
              <i class="fa-solid fa-plus-circle text-lg"></i> Agregar / Actualizar Servicio en Cotización
            </button>
          </div>

        </div>

        <!-- COLUMNA DERECHA: RESUMEN FLOTANTE -->
        <div class="bg-slate-900 text-white p-6 rounded-xl flex flex-col justify-between shadow-xl sticky top-6 z-10 border border-slate-800">
          <div>
            <span class="text-xs uppercase font-bold tracking-widest text-emerald-400">Resumen Detallado</span>
            <h3 class="text-lg font-bold mt-1 text-white border-b border-slate-700 pb-2">Servicios Confirmados</h3>
            
            <div id="servicesBreakdown" class="my-4 max-h-[45vh] overflow-y-auto pr-1"></div>
          </div>

          <div class="border-t border-slate-700 pt-4 space-y-3">
            <div class="flex justify-between items-baseline">
              <span class="text-xs text-gray-400 uppercase font-semibold">Total estimado</span>
              <div id="summaryTotal" class="text-3xl font-black text-amber-400">Bs 0</div>
            </div>

            <!-- Botón WhatsApp -->
            <button onclick="sendToWhatsApp()" class="w-full bg-green-600 hover:bg-green-500 active:bg-green-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 transition shadow-md text-sm">
              <i class="fa-brands fa-whatsapp text-xl"></i> Reservar por WhatsApp
            </button>

            <!-- Botón Voz -->
            <button onclick="talkQuote()" class="w-full bg-slate-800 hover:bg-slate-700 text-emerald-400 font-bold py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition border border-slate-700 text-xs">
              <i class="fa-solid fa-volume-high"></i> Escuchar Cotización
            </button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ASISTENTE FLOTANTE Y CHATBOT CON IA -->
  <div class="fixed bottom-6 right-6 z-50 flex flex-col items-end">
    <div id="chatBox" class="hidden mb-4 w-80 sm:w-96 bg-slate-900 text-white rounded-2xl shadow-2xl border border-slate-800 overflow-hidden flex flex-col h-[450px] transition-all">
      <div class="bg-slate-800 p-4 flex justify-between items-center border-b border-slate-700">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-robot text-emerald-400"></i>
          <span class="font-bold text-sm">Asistente LIM-BOLIVIA</span>
        </div>
        <button onclick="toggleChat()" class="text-gray-400 hover:text-white">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div id="chatMessages" class="flex-1 p-4 overflow-y-auto space-y-3 text-xs"></div>

      <div class="p-3 bg-slate-800 border-t border-slate-700 flex gap-2 items-center">
        <input type="text" id="userInput" placeholder="Escribe tu mensaje..." class="flex-1 bg-slate-900 text-white text-xs px-3 py-2 rounded-lg border border-slate-700 focus:outline-none focus:border-emerald-500" onkeypress="if(event.key === 'Enter') sendMessage()">
        
        <button onclick="startListening()" class="bg-slate-700 hover:bg-slate-600 text-emerald-400 p-2 rounded-lg transition" title="Hablar por micrófono">
          <i class="fa-solid fa-microphone"></i>
        </button>
        
        <button onclick="sendMessage()" class="bg-emerald-600 hover:bg-emerald-500 text-white p-2 rounded-lg transition">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </div>

    <button onclick="toggleChat()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-5 rounded-full shadow-2xl flex items-center gap-2 transition transform hover:scale-105">
      <i class="fa-solid fa-robot text-xl"></i>
      <span>Hablar con IA</span>
    </button>
  </div>

  <!-- JS SCRIPTS CON RUTAS ABSOLUTAS -->
  <script src="/js/calculator.js"></script>
  <script src="/js/chatbot.js"></script>
</body>
</html>
